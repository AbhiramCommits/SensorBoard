name: OpenAPI drift check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  openapi-drift:
    name: OpenAPI parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e "backend[dev]"
      - name: Compare FastAPI schema with openapi/telemetry.yaml
        run: python -m pytest backend/tests/test_openapi_parity.py -q
