name: Bug report
description: Report a defect in SensorBoard.
title: '[Bug]: '
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /sensors
        2. Filter by type=temperature
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA, release tag, or branch where you saw the bug.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, browser/OS versions.
