services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sensorboard
      POSTGRES_PASSWORD: sensorboard
      POSTGRES_DB: sensorboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensorboard -d sensorboard"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sensorboard:sensorboard@db:5432/sensorboard
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  pgdata:
